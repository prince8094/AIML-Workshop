<!DOCTYPE html>
<html>

<head>

    <title>Create Account</title>

    <style>

        body {
            font-family: Arial;
            background: #f4f4f4;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            width: 350px;

            border-radius: 10px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;

            background: green;
            color: white;

            border: none;
        }

    </style>

</head>


<body>

<div class="box">

    <h2>Create Account</h2>

    <form id="registerForm">

        <input
            type="text"
            id="name"
            placeholder="Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <p id="message"></p>

    <a href="/login">
        Already have an account? Login
    </a>

</div>


<script>

document
    .getElementById("registerForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        const response = await fetch("/register", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                email: email,
                password: password
            })

        });


        const data = await response.json();

        document.getElementById("message")
            .innerText = data.message;

    });

</script>

</body>

</html>
